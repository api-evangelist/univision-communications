meters:
  - name: ad_insertion_order
    description: Ad inventory bought through insertion-orders or programmatic auction across TelevisaUnivision
      properties (TV, radio, ViX streaming, digital).
    unit: varies
    aggregation: sum
    dimensions:
      - property
      - format
      - daypart
  - name: partner_agreement
    description: Distribution / partner agreement covering content syndication or platform integration.
    unit: varies
    aggregation: sum
principles:
  - name: Visibility
    description: API consumption is not separately metered. Track ad delivery and partner integration
      volume against insertion-order or distribution-agreement targets.
  - name: Allocation
    description: Allocate spend at the campaign or partnership level, typically already aligned with
      a marketing or distribution business owner.
  - name: Optimization
    description: Optimization happens at the buy level - daypart selection, programmatic vs direct,
      property mix - rather than per-API-call.
  - name: Accountability
    description: Assign ownership to the campaign manager (buy-side) or partnership owner (distribution-side);
      FinOps signals are the post-campaign performance and partner-usage reports.
